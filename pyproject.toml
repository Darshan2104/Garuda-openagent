[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garuda-openagent"
version = "1.2.0"
description = "Universal provider-agnostic agent harness for terminal and software engineering tasks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    # >=1.63: reasoning_effort, thinking param, and assistant thinking_blocks
    # round-trip must exist or extended thinking silently no-ops.
    "litellm>=1.63.0",
    "pyyaml>=6.0",
    # >=1.9: the streamable-HTTP / SSE transports used by mcp/client.py exist.
    # <2: mcp 2.0 renamed `streamablehttp_client` to `streamable_http_client` *and*
    # changed its signature — `headers` and `timeout` were replaced by a caller-built
    # `http_client` object. Without this cap a plain `pip install -e .` resolved to
    # 2.0.0 and the harness could not run a single task: importing garuda.mcp.client
    # raised ImportError, which is on the path of every run. A rename shim alone would
    # not fix it, and the 2.0 transport path has no local reproduction to test against
    # (see docs/BACKLOG.md), so the bound states the range that actually works rather
    # than shipping a guessed one. Raise it deliberately, with an HTTP MCP server to
    # verify against.
    "mcp>=1.9.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
eval = [
    "harbor>=0.16.0",
]
docs = [
    "pypdf>=4.0",
    "openpyxl>=3.1",
]
tui = [
    "rich>=13.0",
]
observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
server = []

[project.scripts]
garuda = "garuda.interfaces.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["garuda*"]

[tool.setuptools.package-data]
garuda = [
    "agents/defaults/*.yaml",
    "agents/defaults/*.md",
    "config/defaults/*.yaml",
    # The dashboard frontend. Without this the wheel installs a server that
    # serves a blank page; tests/test_web_static.py guards it.
    "interfaces/web/static/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Matches the code as written; E501 is deliberately NOT enabled (reflowing ~770
# existing lines would bury real findings in whitespace churn).
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# ruff's default set (E4/E7/E9 + F) plus:
#   I — import sorting, so import order stops drifting per-commit
#   B — flake8-bugbear, which catches real defects (e.g. an unstrict zip() that
#       would silently misalign parallel tool results with their tool_call_ids)
select = ["E4", "E7", "E9", "F", "I", "B"]
