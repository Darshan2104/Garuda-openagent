name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly run of the non-blocking jobs, which do not run on pull requests.
    - cron: "17 3 * * *"

concurrency:
  # A newer push to a pull request makes its in-flight run redundant. Runs on
  # main are not cancelled, so every merge gets a complete record.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The gate. Pinned via constraints.txt, so a failure here is this repo's
    # fault and nobody has to ask which upstream release moved underneath it.
    name: test (${{ matrix.os }}, pinned)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        # bubblewrap = the Linux sandbox backend; tmux backs the tmux_exec /
        # tmux_capture tools (those tests skip when it is absent). ripgrep ships on
        # GitHub runners, so grep's rg path is covered, not only its grep -E fallback.
        # Ubuntu 24.04+ AppArmor blocks unprivileged user namespaces by default,
        # which makes bwrap fail with ``loopback: Failed RTM_NEWADDR`` before any
        # command runs — clear that gate on GitHub-hosted Linux runners.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap tmux
            current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
              sudo sysctl -w kernel.unprivileged_userns_clone=1
            fi
            current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
            if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          else
            brew install tmux
          fi

      - name: Install package and extras (pinned)
        run: pip install -e ".[dev,eval,docs,tui,observability]" -c constraints.txt

      - name: Record resolved versions
        # So a failure can be read against what was actually installed.
        run: pip freeze

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Validate documented Garuda commands
        run: python scripts/check_docs.py --commands

      - name: Test
        # Parallel across the runner's cores; the suite is verified worker-safe.
        run: pytest -q -n auto

  browser-checks:
    # The dashboard frontend is plain <script> files with no build step, so nothing in the
    # pytest suite executes it; tests/browser is the only test of it, and it rotted while it
    # ran nowhere. Seeds fixtures through the production writers, starts real dashboards and
    # drives them in headless Chromium. The Linux owned starts need Google Chrome and run in
    # browser-owned-starts.yml, so they are skipped here.
    name: browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (pinned) and Playwright Chromium
        run: |
          pip install -e ".[dev]" -c constraints.txt
          pip install "playwright==1.65.2"
          python -m playwright install --with-deps chromium

      - name: Run browser checks
        run: >-
          python tests/browser/run_checks.py --skip-owned-starts
          --workdir "${{ runner.temp }}/browser-checks"

      - name: Upload screenshots and dashboard logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: |
            ${{ runner.temp }}/browser-checks/screenshots/
            ${{ runner.temp }}/browser-checks/*.log
          if-no-files-found: ignore

  wheel-install:
    # Issue #145: a non-editable install must import and run without the
    # repository's tests/ directory. The test job only installs editable.
    name: wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist

      - name: Install it outside the checkout and run it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl -c constraints.txt
          cd /tmp
          /tmp/wheel-venv/bin/python -c "import garuda.model.factory, garuda.interfaces.main"
          /tmp/wheel-venv/bin/python -c "from garuda.scenarios.catalog import load_catalog; assert set(load_catalog()) == {'plan-change', 'plan-feedback', 'build-review', 'run-with-role', 'ask-role'}"
          /tmp/wheel-venv/bin/garuda --help > /dev/null
          /tmp/wheel-venv/bin/garuda starter example reconnect /tmp/reconnect-wheel-example

  docs-contract:
    # Issue #9 (P0.3): fail on broken local docs links, nested READMEs,
    # hand-maintained test counts, and duplicate tables. Stdlib only and never
    # fetches remote URLs; parser-backed command checks run in the test job.
    name: docs contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check dependency-free docs contracts
        run: python scripts/check_docs.py

      - name: Docs contract tests
        run: |
          pip install pytest
          pytest tests/test_docs_contract.py -q

  contract-matrix:
    # Issue #42 (P1.10): every adapter runs the common scenarios against fake
    # harnesses and publishes per-adapter JSON reports. No subscriptions.
    name: contract matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and extras (pinned)
        run: pip install -e ".[dev,eval,docs,tui,observability]" -c constraints.txt

      - name: Run contract matrix
        run: python -m garuda.eval.contract_matrix --out contract-reports

      - name: Upload contract reports
        uses: actions/upload-artifact@v4
        with:
          name: contract-reports
          path: contract-reports/

  latest-deps:
    # Early warning, not a gate. pyproject lower-bounds its dependencies so the
    # package installs alongside whatever a host app already has; this job is
    # what tells us when "whatever" has stopped working. It is allowed to fail:
    # an upstream release should not block an unrelated PR, it should open an
    # issue. Cost of getting this backwards is on record — a live pricing table
    # broke the suite and the failure looked like ours.
    # Runs on main, nightly and on demand, not on pull requests: three full
    # suites per OS per PR exhausted the hosted macOS runner pool.
    if: github.event_name != 'pull_request'
    name: latest dependencies (${{ matrix.os }}, non-blocking)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap tmux
            current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
              sudo sysctl -w kernel.unprivileged_userns_clone=1
            fi
            current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
            if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          else
            brew install tmux
          fi

      - name: Install package and extras (unconstrained, newest resolvable)
        run: pip install -e ".[dev,eval,docs,tui,observability]" --upgrade

      - name: Record resolved versions
        # The diff against constraints.txt is the finding when this job goes red.
        run: pip freeze

      - name: Test
        run: pytest -q -n auto

  live-sandbox:
    # Deliberately NOT a required gate. Live Seatbelt/bwrap confinement behaves
    # differently across OS image versions, which is why these tests are opt-in
    # (see commit 029fa77). Running them here keeps the coverage visible without
    # letting an image upgrade break every PR.
    # Same schedule as latest-deps: main, nightly and on demand.
    if: github.event_name != 'pull_request'
    name: live sandbox (${{ matrix.os }}, non-blocking)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap tmux
            current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
              sudo sysctl -w kernel.unprivileged_userns_clone=1
            fi
            current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
            if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          else
            brew install tmux
          fi

      - name: Install package and extras
        run: pip install -e ".[dev,eval,docs,tui,observability]" -c constraints.txt

      - name: Test with real OS sandbox confinement
        env:
          GARUDA_LIVE_SANDBOX: "1"
        run: pytest -q -n auto
