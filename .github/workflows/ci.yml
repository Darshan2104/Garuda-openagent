name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same ref makes the in-flight run redundant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The gate. Pinned via constraints.txt, so a failure here is this repo's
    # fault and nobody has to ask which upstream release moved underneath it.
    name: test (${{ matrix.os }}, pinned)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        # bubblewrap = the Linux sandbox backend; tmux backs the tmux_exec /
        # tmux_capture tools (those tests skip when it is absent). ripgrep ships on
        # GitHub runners, so grep's rg path is covered, not only its grep -E fallback.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap tmux
          else
            brew install tmux
          fi

      - name: Install package and extras (pinned)
        run: pip install -e ".[dev,eval,docs,tui,observability]" -c constraints.txt

      - name: Record resolved versions
        # So a failure can be read against what was actually installed.
        run: pip freeze

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Test
        run: pytest -q

  docs-contract:
    # Issue #9 (P0.3): fail on broken local docs links, nested READMEs, and
    # hand-maintained test counts. Stdlib only and never fetches remote URLs.
    name: docs contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check docs links, READMEs, and test-count claims
        run: python scripts/check_docs.py

      - name: Docs contract tests
        run: |
          pip install pytest
          pytest tests/test_docs_contract.py -q

  latest-deps:
    # Early warning, not a gate. pyproject lower-bounds its dependencies so the
    # package installs alongside whatever a host app already has; this job is
    # what tells us when "whatever" has stopped working. It is allowed to fail:
    # an upstream release should not block an unrelated PR, it should open an
    # issue. Cost of getting this backwards is on record — a live pricing table
    # broke the suite and the failure looked like ours.
    name: latest dependencies (${{ matrix.os }}, non-blocking)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap tmux
          else
            brew install tmux
          fi

      - name: Install package and extras (unconstrained, newest resolvable)
        run: pip install -e ".[dev,eval,docs,tui,observability]" --upgrade

      - name: Record resolved versions
        # The diff against constraints.txt is the finding when this job goes red.
        run: pip freeze

      - name: Test
        run: pytest -q

  live-sandbox:
    # Deliberately NOT a required gate. Live Seatbelt/bwrap confinement behaves
    # differently across OS image versions, which is why these tests are opt-in
    # (see commit 029fa77). Running them here keeps the coverage visible without
    # letting an image upgrade break every PR.
    name: live sandbox (${{ matrix.os }}, non-blocking)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap tmux
          else
            brew install tmux
          fi

      - name: Install package and extras
        run: pip install -e ".[dev,eval,docs,tui,observability]" -c constraints.txt

      - name: Test with real OS sandbox confinement
        env:
          GARUDA_LIVE_SANDBOX: "1"
        run: pytest -q
