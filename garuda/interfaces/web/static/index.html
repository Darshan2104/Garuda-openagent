<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garuda</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Garuda</span>
      <span class="badge" id="mode-badge">…</span>
    </div>
    <nav class="nav">
      <a href="#/starters" class="nav-link" data-nav="starters">Starters</a>
      <a href="#/runs" class="nav-link" data-nav="runs">Runs</a>
      <a href="#/sessions" class="nav-link" data-nav="sessions">Sessions</a>
      <a href="#/inbox" class="nav-link" data-nav="inbox">Approvals<span class="nav-count" id="nav-inbox-count" hidden></span></a>
      <a href="#/usage" class="nav-link" data-nav="usage">Usage</a>
      <a href="#/setup" class="nav-link" data-nav="setup">Setup</a>
      <a href="#/providers" class="nav-link" data-nav="providers">Providers</a>
      <a href="#/runtimes" class="nav-link" data-nav="runtimes">Runtimes</a>
      <a href="#/chat" class="nav-link" data-nav="chat" id="nav-chat">Chat</a>
    </nav>
    <div class="topbar-right">
      <span class="meta" id="version-label"></span>
      <button type="button" class="theme-toggle" id="keys-toggle" title="Keyboard shortcuts (?)">?</button>
      <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme">◑</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div id="toast" class="toast" hidden></div>

  <div id="keys-help" class="keys-help" hidden>
    <div class="card" role="dialog" aria-label="Keyboard shortcuts">
      <h2>Keyboard shortcuts</h2>
      <table><tbody>
        <tr><td><kbd>1</kbd> – <kbd>9</kbd></td><td>Switch to the nth tab</td></tr>
        <tr><td><kbd>/</kbd></td><td>Focus this page's search</td></tr>
        <tr><td><kbd>r</kbd></td><td>Reload this view</td></tr>
        <tr><td><kbd>t</kbd></td><td>Toggle light / dark</td></tr>
        <tr><td><kbd>?</kbd></td><td>Show or hide this help</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>Close help, leave a search field</td></tr>
      </tbody></table>
    </div>
  </div>

  <script src="/static/core.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/views_runs.js"></script>
  <script src="/static/views_runtimes.js"></script>
  <script src="/static/views_sessions.js"></script>
  <script src="/static/views_usage.js"></script>
  <script src="/static/views_trajectory.js"></script>
  <script src="/static/views_chat.js"></script>
  <script src="/static/views_scenarios.js"></script>
  <script src="/static/router.js"></script>
</body>
</html>
