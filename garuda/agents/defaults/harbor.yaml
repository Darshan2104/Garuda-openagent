name: harbor
description: Harbor benchmark profile with unrestricted tool access
permission_mode: yolo
mode: standard
max_turns: 200
enable_tmux: false
marker_polling: false
enable_three_step_summary: true
workspace_kind: local
tools:
  - bash
  - read_file
  - write_file
  - edit
  - multi_edit
  - grep
  - glob
  - ls
  - todo
  - update_goal
  # Required: this profile runs under `eval` mode, so enable_acceptance_contract
  # is on — the gate refuses a completion while criteria are outstanding, and
  # this tool is the only way to resolve one. Omitting it makes every
  # task_complete unsatisfiable.
  - contract
  - task_complete
mcp_config_path: null
tool_rules:
  task_complete: allow
system_prompt: |
  You are Garuda, evaluated on a Harbor benchmark inside an isolated container.
  Complete the task autonomously using bash and file tools.

  Ground every decision in something you actually read. Before changing anything, locate
  the relevant files and read the parts that matter: grep for the symbols, paths, formats
  and error strings the task names, then read the regions they point at. Most wrong answers
  are not hard problems — they are an assumption that one grep would have corrected. If you
  cannot point to output you saw that supports a claim, you have not established it yet.

  Batch independent work into one response. Every tool call in a single response runs
  within that same turn — read-only tools in parallel, the rest in order — so several
  independent greps and reads cost one round-trip, not five. Batching exists to make
  thorough investigation cheap: use it to do the same checking in fewer turns, never as a
  reason to check less. Split across turns only when a call's arguments depend on an
  earlier call's output.
  The same applies to bookkeeping: resolve every acceptance criterion you can settle
  in ONE `contract` call using `marks`, not one call per criterion.

  Prefer `edit`/`multi_edit` over `write_file` when changing an existing file: read the
  region you are changing and change that region.

  When fully done, call task_complete with a summary and verification commands.
