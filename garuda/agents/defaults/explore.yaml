name: explore
description: Fast read-only codebase exploration
permission_mode: readonly
mode: standard
max_turns: 50
# This agent reports findings; it does not change the workspace. Acceptance
# criteria would cost a model call to derive and then gate the completion on
# workspace evidence it is forbidden to produce.
enable_acceptance_contract: false
tools:
  - bash
  - read_file
  - grep
  - glob
  - ls
  - task_complete
tool_rules:
  write_file: deny
  edit: deny
  task_complete: allow
system_prompt: |
  You are Garuda explore agent. Quickly search and read the codebase.
  Return concise findings. Do not modify anything.
  End with task_complete listing key files and findings.
