site_name: Garuda Open Agent
site_description: Provider-agnostic coding-agent harness documentation
site_url: https://darshan2104.github.io/Garuda-openagent/
repo_url: https://github.com/Darshan2104/Garuda-openagent
repo_name: Darshan2104/Garuda-openagent
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Getting started: guides/getting-started.md
  - User guides:
      - Using Garuda: guides/using-garuda.md
      - Safety and workspaces: guides/safety-and-workspaces.md
      - Configuration: guides/configuration.md
      - External harnesses: guides/external-harnesses.md
      - Web dashboard: guides/web-dashboard.md
  - Reference:
      - CLI: reference/cli.md
  - Architecture:
      - Architecture: ARCHITECTURE.md
      - Module map: MODULES.md
      - Major changes: major-changes.md
  - Development:
      - Development guide: development/development.md
      - Browser checks: development/browser-checks.md
  - Evaluation:
      - Overview: evaluation/index.md
      - Dual-model routing: evaluation/dual-model-routing.md
      - Terminal-Bench: evaluation/terminal-bench.md
      - SpreadsheetBench: evaluation/spreadsheet-bench.md
      - PDF and OfficeQA: evaluation/pdf-officeqa.md
  - Planning and history:
